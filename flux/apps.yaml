apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps
  namespace: flux-system
spec:
  interval: 5m
  path: ./k8s/overlays/local
  prune: true
  sourceRef:
    kind: GitRepository
    name: user-app-repo
  dependsOn:
    - name: infrastructure
    - name: gatekeeper
    - name: postgresql
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: user-app
      namespace: user-app
