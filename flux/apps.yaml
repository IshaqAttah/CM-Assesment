apiVersion: helm.toolkit.fluxcd.io/v2

kind: HelmRelease

metadata:
  name: user-app

  namespace: flux-system

spec:
  interval: 5m

  targetNamespace: user-app

  install:
    createNamespace: true

    remediation:
      retries: 3

  chart:
    spec:
      chart: ./charts/user-app

      sourceRef:
        kind: GitRepository

        name: user-app-repo
