apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: user-app
  namespace: flux-system
spec:
  interval: 5m
  releaseName: user-app
  targetNamespace: user-app
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    disableWait: true
    remediation:
      retries: 3
      remediateLastFailure: true
  rollback:
    disableWait: true
  chart:
    spec:
      chart: ./charts/user-app
      sourceRef:
        kind: GitRepository
        name: user-app-repo
