apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: user-app
  namespace: flux-system
spec:
  interval: 5m
  targetNamespace: user-app
  dependsOn:
    - name: cert-manager
    - name: ingress-nginx
    - name: flagger
  chart:
    spec:
      chart: ./charts/user-app
      sourceRef:
        kind: GitRepository
        name: user-app-repo
  values:
    image:
      tag: "1.2.6"
