apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure-sources
  namespace: flux-system
spec:
  interval: 1h
  path: ./infrastructure/sources
  prune: true
  sourceRef:
    kind: GitRepository
    name: user-app-repo
  dependsOn:
    - name: infrastructure-namespaces
