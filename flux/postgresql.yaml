apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: postgresql
  namespace: flux-system
spec:
  interval: 10m
  path: ./k8s/base/postgresql
  prune: true
  sourceRef:
    kind: GitRepository
    name: user-app-repo
  healthChecks:
    - apiVersion: apps/v1
      kind: StatefulSet
      name: postgresql
      namespace: postgresql
