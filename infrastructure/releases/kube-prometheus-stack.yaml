apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
name: kube-prometheus-stack
namespace: flux-system
spec:
interval: 1h
targetNamespace: monitoring
chart:
  spec:
    chart: kube-prometheus-stack
    version: "56.0.0"
    sourceRef:
      kind: HelmRepository
      name: prometheus-community
      namespace: flux-system
values:
  nodeExporter:
    enabled: false
  grafana:
    sidecar:
      dashboards:
        enabled: true
        label: grafana_dashboard
    service:
      type: ClusterIP
    adminPassword: ""
  prometheus:
    prometheusSpec:
      scrapeInterval: 30s
      retention: 24h
      resources:
        requests:
          memory: "512Mi"
          cpu: "300m"
        limits:
          memory: "1Gi"
          cpu: "500m"
  alertmanager:
    enabled: true
    service:
      type: ClusterIP
  defaultRules:
    create: true
install:
  createNamespace: true
