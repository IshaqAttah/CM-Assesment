apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: chaos-mesh
  namespace: flux-system
spec:
  interval: 1h
  targetNamespace: chaos-testing
  chart:
    spec:
      chart: chaos-mesh
      version: "2.6.2"
      sourceRef:
        kind: HelmRepository
        name: chaos-mesh
        namespace: flux-system
  values:
    chaosDaemon:
      runtime: containerd
      socketPath: /run/containerd/containerd.sock

  install:
    createNamespace: true
