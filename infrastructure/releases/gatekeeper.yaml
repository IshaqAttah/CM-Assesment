apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gatekeeper
  namespace: flux-system
spec:
  interval: 1h
  targetNamespace: gatekeeper-system
  chart:
    spec:
      chart: gatekeeper
      version: "3.16.0"
      sourceRef:
        kind: HelmRepository
        name: gatekeeper
        namespace: flux-system
  values:
    auditInterval: 30
  install:
    createNamespace: true
