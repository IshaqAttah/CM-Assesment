apiVersion: v1
kind: ConfigMap
metadata:
  name: user-app-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1" # triggers auto-import by Grafana sidecar
data:
  user-app-dashboard.json: |-
    {
      "title": "My App",
      "tags": ["user-app"],
      "timezone": "browser",
      "panels": [
        {
          "id": 1,
          "title": "Request Rate",
          "type": "stat",
          "targets": [{"expr": "sum(rate(http_requests_total{job=\"user-app\"}[5m]))", "legendFormat": "req/s"}],
          "gridPos": {"h": 4, "w": 6, "x": 0, "y": 0}
        },
        {
          "id": 2,
          "title": "Error Rate",
          "type": "stat",
          "targets": [{"expr": "sum(rate(http_requests_total{job=\"user-app\",status=~\"5..\"}[5m])) / sum(rate(http_requests_total{job=\"user-app\"}[5m]))", "legendFormat": "error %"}],
          "gridPos": {"h": 4, "w": 6, "x": 6, "y": 0}
        },
        {
          "id": 3,
          "title": "P95 Latency",
          "type": "stat",
          "targets": [{"expr": "histogram_quantile(0.95, rate(http_request_duration_seconds_bucket{job=\"user-app\"}[5m]))", "legendFormat": "p95"}],
          "gridPos": {"h": 4, "w": 6, "x": 12, "y": 0}
        },
        {
          "id": 4,
          "title": "Request Duration Heatmap",
          "type": "heatmap",
          "targets": [{"expr": "rate(http_request_duration_seconds_bucket{job=\"user-app\"}[5m])", "legendFormat": "{{le}}"}],
          "gridPos": {"h": 8, "w": 24, "x": 0, "y": 4}
        }
      ]
    }
