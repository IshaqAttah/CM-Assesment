name: user-app Pipeline

on:
  push:
    branches: [main]
    paths:
      - "app/**"

jobs:
  test-and-security:
    name: Tests & Security Scans
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: go1.26.4
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.4"
          cache: true
      - name: Unit tests
        run: go test ./... -v -race -coverprofile=coverage.out
      - name: gosec
        uses: securego/gosec@master
        with:
          args: ./...
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    needs: test-and-security
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      new_release_published: ${{ steps.release.outputs.new_release_published }}
      new_release_version: ${{ steps.release.outputs.new_release_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install semantic-release
        run: npm ci
      - name: Run semantic-release
        id: release
        run: |
          npx semantic-release
          git fetch --tags
          LATEST_TAG=$(git tag --sort=-creatordate | grep "user-app-v" | head -1)
          if [ -n "$LATEST_TAG" ]; then
            VERSION=${LATEST_TAG#user-app-v}
            echo "new_release_published=true" >> $GITHUB_OUTPUT
            echo "new_release_version=$VERSION" >> $GITHUB_OUTPUT
          else
            echo "new_release_published=false" >> $GITHUB_OUTPUT
            echo "new_release_version=" >> $GITHUB_OUTPUT
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-scan-deploy:
    name: Build, Scan & Deploy
    runs-on: ubuntu-latest
    needs: release
    if: needs.release.outputs.new_release_published == 'true'
    permissions:
      contents: write
      packages: write
    env:
      IMAGE: ghcr.io/ishaqattah/user-app
      VERSION: ${{ needs.release.outputs.new_release_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (SHA tag)
        uses: docker/build-push-action@v6
        with:
          context: ./app
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          format: table
          vuln-type: os,library
          severity: HIGH,CRITICAL
          exit-code: "1"

      - name: Promote to release version
        run: |
          docker buildx imagetools create \
            -t ${{ env.IMAGE }}:${{ env.VERSION }} \
            -t ${{ env.IMAGE }}:latest \
            ${{ env.IMAGE }}:${{ github.sha }}

      - name: Update Helm chart image tag
        run: |
          sed -i 's/^  tag: .*/  tag: "${{ env.VERSION }}"/' charts/user-app/values.yaml

      - name: Commit and push
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "ci: update user-app image to ${{ env.VERSION }} [skip ci]"
          file_pattern: charts/user-app/values.yaml
