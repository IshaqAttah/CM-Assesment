apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{.Release.Name}}
  namespace: {{.Release.Namespace}}
  labels: {{- include "user-app.labels" . | nindent 4}}
spec:
  replicas: {{.Values.replicaCount}}

  selector:
    matchLabels: {{- include "user-app.selectorLabels" . | nindent 6}}

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  template:
    metadata:
      labels: {{- include "user-app.selectorLabels" . | nindent 8}}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "{{ .Values.service.port }}"
        prometheus.io/path: "/metrics"

    spec:
      serviceAccountName: {{.Release.Name}}

      containers:
        - name: {{.Release.Name}}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{.Values.image.pullPolicy}}

          ports:
            - name: http
              containerPort: {{.Values.service.port}}
              protocol: TCP

          env:
            - name: PORT
              value: "{{ .Values.service.port }}"

            - name: DATABASE_HOST
              valueFrom:
                configMapKeyRef:
                  name: {{.Values.database.configMapName}}
                  key: POSTGRES_HOST

            - name: DATABASE_PORT
              valueFrom:
                configMapKeyRef:
                  name: {{.Values.database.configMapName}}
                  key: POSTGRES_PORT

            - name: DATABASE_NAME
              valueFrom:
                configMapKeyRef:
                  name: {{.Values.database.configMapName}}
                  key: POSTGRES_DB

            - name: DATABASE_USER
              valueFrom:
                configMapKeyRef:
                  name: {{.Values.database.configMapName}}
                  key: POSTGRES_USER

            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{.Values.database.secretName}}
                  key: POSTGRES_PASSWORD

          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]

          resources:
            requests:
              cpu: {{.Values.resources.requests.cpu}}
              memory: {{.Values.resources.requests.memory}}
            limits:
              cpu: {{.Values.resources.limits.cpu}}
              memory: {{.Values.resources.limits.memory}}

          startupProbe:
            httpGet:
              path: /startup
              port: {{.Values.service.port}}
            failureThreshold: 30
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /healthz
              port: {{.Values.service.port}}
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 5

          readinessProbe:
            httpGet:
              path: /readyz
              port: {{.Values.service.port}}
            initialDelaySeconds: 3
            periodSeconds: 5
            failureThreshold: 2
            timeoutSeconds: 3
